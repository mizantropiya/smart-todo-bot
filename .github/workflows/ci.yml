name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_todo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_todo_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/smart_todo_ci?schema=public
      NODE_ENV: test
      BOT_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:integration

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config
      - name: Build Docker Compose stack
        run: docker compose build
      - name: Start Docker Compose stack
        run: docker compose up -d
      - name: Smoke test local Docker stack
        run: |
          set -euo pipefail

          for attempt in {1..60}; do
            if curl -fsS http://localhost:4000/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:4000/api/health

          for attempt in {1..60}; do
            if curl -fsS http://localhost:5173 >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:5173 >/dev/null

          created_id="$(
            curl -fsS \
              -H "Content-Type: application/json" \
              -H "X-Dev-Telegram-User-Id: 123456789" \
              -d '{"text":"Docker smoke task"}' \
              http://localhost:4000/api/tasks |
            node -e "let data=''; process.stdin.on('data', chunk => data += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(data).id));"
          )"

          curl -fsS -H "X-Dev-Telegram-User-Id: 123456789" http://localhost:4000/api/tasks >/dev/null
          curl -fsS \
            -X PATCH \
            -H "Content-Type: application/json" \
            -H "X-Dev-Telegram-User-Id: 123456789" \
            -d '{"completed":true}' \
            "http://localhost:4000/api/tasks/${created_id}" >/dev/null
          curl -fsS \
            -X DELETE \
            -H "X-Dev-Telegram-User-Id: 123456789" \
            "http://localhost:4000/api/tasks/${created_id}" >/dev/null
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v
